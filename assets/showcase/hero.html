<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  /* The README hero. ?t=0 shows the window stretched, ?t=1 centered,
     values in between cross-fade; render.sh turns the steps into the
     animation.

     An ultrawide at dusk with its one window lit in amber, the active
     border colour (0xFFF3B23E) of the setup the captures come from. The
     windows sit where yabai put them on that 3360 x 1418 pt display:
     centered at x 640 and 2080 pt wide, stretched at x 12 and 3336 pt
     wide. */
  :root {
    --amber: #f3b23e;
    --amber-soft: #ffcf7a;
    --ink: #f5f1ff;
    --screen-w: 1100px;
    --t: 1;
    --pad-opacity: var(--t);
    --screen-h: calc(var(--screen-w) * 1418 / 3360);
  }
  html, body { margin: 0; width: 1280px; height: 620px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(closest-side, rgba(243,178,62,calc(.08 + .24 * var(--t))), transparent) 50% 101% / 1100px 170px no-repeat,
      radial-gradient(closest-side, rgba(126,84,230,.32), transparent) 8% 0% / 900px 620px no-repeat,
      radial-gradient(closest-side, rgba(214,92,160,.18), transparent) 96% 18% / 760px 560px no-repeat,
      linear-gradient(180deg, #1f1836 0%, #151a33 55%, #0e1222 100%);
    font-family: var(--sans); color: var(--ink);
  }
  .monitor { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); }
  .bezel {
    position: relative; padding: 11px; border-radius: 20px;
    background: linear-gradient(180deg, #2a2d3d, #12141d 40%, #0b0c12);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      0 40px 70px rgba(4,5,12,.7);
  }
  .screen {
    position: relative; width: var(--screen-w); height: var(--screen-h);
    border-radius: 10px; overflow: hidden;
    background:
      radial-gradient(closest-side, rgba(243,178,62,calc(.28 * var(--t))), transparent) 50% 55% / 980px 540px no-repeat,
      radial-gradient(closest-side, rgba(132,88,240,.80), transparent) -4% 105% / 560px 420px no-repeat,
      radial-gradient(closest-side, rgba(226,92,160,.62), transparent) 104% -6% / 560px 420px no-repeat,
      radial-gradient(closest-side, rgba(64,120,230,.45), transparent) 100% 100% / 420px 320px no-repeat,
      linear-gradient(135deg, #30265a, #1c2350 60%, #161c3e);
  }
  /* Glass: a faint sheen across the panel. */
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 38%);
  }
  .win {
    position: absolute;
    top: calc(43 / 1418 * 100%); height: calc(1363 / 1418 * 100%);
    border-radius: 7px;
  }
  .win img { display: block; width: 100%; height: 100%; border-radius: 6px; }
  .stretched {
    left: calc(12 / 3360 * 100%); width: calc(3336 / 3360 * 100%);
    opacity: calc(1 - var(--t));
    box-shadow: 0 0 0 2.5px var(--amber), 0 18px 40px rgba(0,0,0,.5);
  }
  .centered {
    left: calc(640 / 3360 * 100%); width: calc(2080 / 3360 * 100%);
    opacity: var(--t);
    box-shadow: 0 0 0 2.5px var(--amber), 0 0 40px rgba(243,178,62,.55), 0 18px 40px rgba(0,0,0,.5);
  }
  /* The padding the script sets, shown as two lit bands between the
     screen edges and the window, each with an arrow and its name. */
  .pad {
    position: absolute; top: calc(43 / 1418 * 100%); height: calc(1363 / 1418 * 100%);
    width: calc(616 / 3360 * 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(255,207,122,.10), rgba(255,207,122,.03));
    box-shadow: inset 0 0 0 1px rgba(255,207,122,.22);
    color: var(--amber-soft);
    font-family: var(--display); font-weight: 600; font-size: var(--pad-font, 22px);
    opacity: var(--pad-opacity, 1);
  }
  .pad.left { left: calc(12 / 3360 * 100%); }
  .pad.right { right: calc(12 / 3360 * 100%); }
  .pad svg { width: 70%; height: 18px; overflow: visible; }
  .caption {
    position: absolute; left: 0; right: 0; top: 548px; text-align: center;
    font-family: var(--display); font-weight: 500; font-size: 26px; color: var(--ink);
  }
  .caption span { position: absolute; left: 0; right: 0; }
  .caption .before { opacity: calc(1 - var(--t)); color: #b9b6cf; }
  .caption .after { opacity: var(--t); color: var(--amber-soft); }
</style>
<script>
  const t = new URLSearchParams(location.search).get("t") ?? "1";
  document.documentElement.style.setProperty("--t", t);
</script>
</head>
<body>
  <div class="monitor">
    <div class="bezel">
      <div class="screen">
        <div class="win stretched"><img src="win-stretched.png" alt=""></div>
        <div class="win centered"><img src="win-centered.png" alt=""></div>
        <div class="pad left"><span>padding</span><svg viewBox="0 0 100 18" preserveAspectRatio="none"><path d="M3 9H97M3 9l8-7M3 9l8 7M97 9l-8-7M97 9l-8 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>
        <div class="pad right"><span>padding</span><svg viewBox="0 0 100 18" preserveAspectRatio="none"><path d="M3 9H97M3 9l8-7M3 9l8 7M97 9l-8-7M97 9l-8 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>
      </div>
    </div>
  </div>
  <div class="caption">
    <span class="before">Without: one window across the whole 3360 pt display</span>
    <span class="after">With yabai-center-single: 2080 pt in the middle, padding on both sides</span>
  </div>
</body>
</html>
